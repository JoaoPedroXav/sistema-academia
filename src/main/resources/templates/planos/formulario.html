<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Plano - Academia</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Academia
        </div>

        <nav class="menu">

            <a href="/" class="menu-item">
                Dashboard
            </a>

            <a href="/alunos/novo" class="menu-item">
                Novo aluno
            </a>

            <a href="/planos" class="menu-item active">
                Planos
            </a>

        </nav>

    </aside>

    <main class="main">

        <div class="page-header">

            <div>

                <h1
                        class="page-title"
                        th:text="${plano.id == null ? 'Novo plano' : 'Editar plano'}">
                </h1>

                <p class="page-subtitle">
                    Cadastre ou altere as informações do plano.
                </p>

            </div>

        </div>

        <div class="card form-card">

            <form
                    th:action="@{/planos/salvar}"
                    th:object="${plano}"
                    method="post">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">

                    <label class="form-label">
                        Nome do plano
                    </label>

                    <input
                            class="form-control"
                            type="text"
                            th:field="*{nome}"
                            placeholder="Ex.: Plano Premium"
                            required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Descrição
                    </label>

                    <textarea
                            class="form-control"
                            th:field="*{descricao}"
                            placeholder="Descreva os benefícios do plano"
                            rows="4"></textarea>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Valor
                    </label>

                    <input
                            class="form-control"
                            type="number"
                            step="0.01"
                            th:field="*{valor}"
                            placeholder="0,00"
                            required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Duração em dias
                    </label>

                    <input
                            class="form-control"
                            type="number"
                            th:field="*{duracaoDias}"
                            placeholder="30"
                            required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                            class="form-control"
                            th:field="*{ativo}">

                        <option th:value="true">Ativo</option>
                        <option th:value="false">Inativo</option>

                    </select>

                </div>

                <div class="form-actions">

                    <button
                            type="submit"
                            class="btn btn-primary">
                        Salvar plano
                    </button>

                    <a
                            href="/planos"
                            class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
